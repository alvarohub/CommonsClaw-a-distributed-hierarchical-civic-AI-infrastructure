<svg xmlns="http://www.w3.org/2000/svg" class="technical-diagram" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="hierarchy-title hierarchy-desc">
  <title id="hierarchy-title">CommonsClaw: proposed hierarchy of place nodes and collective second brain</title>
  <desc id="hierarchy-desc">Sensors and optional embedded AI feed three illustrative place nodes—each acting as the embodied voice or spirit of its place: a school garden, a library or community, and a floating research site. People interact with those place nodes. Permission-controlled peer links and a shared Level 2 host connect the places; wider institutional services are consulted only when needed. A proposed collective second-brain mesh coordinates knowledge discovery, skill specialization, adaptive caching, and energy-aware load balancing.</desc>
  <defs>
    <marker id="hierarchy-data" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#09665f" stroke-width="1.5"/></marker>
    <marker id="hierarchy-sensor" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52676c" stroke-width="1.5"/></marker>
    <marker id="hierarchy-human" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#765180" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1100" height="800" rx="18" fill="#f0f5f3"/>
  <g font-family="Arial, sans-serif" fill="#20383f">
    <text x="35" y="42" font-size="26" font-weight="700">Many places, shared capabilities, locally governed knowledge</text>
    <text x="35" y="73" font-size="18" fill="#52676c">Proposed architecture: a collective "second brain" across energy-aware place nodes</text>
    <rect x="320" y="108" width="460" height="76" rx="10" fill="#153f46"/>
    <text x="550" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">L3+ Wider institutional services</text>
    <text x="550" y="166" text-anchor="middle" font-size="18" fill="#e1efeb">Municipal / national / specialist / global</text>
    <path d="M550 194 V254" stroke="#09665f" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#hierarchy-data)" marker-end="url(#hierarchy-data)"/>
    <text x="574" y="225" font-size="17" fill="#09665f">Only when needed and permitted</text>
    <rect x="320" y="266" width="460" height="78" rx="10" fill="#d9eae4" stroke="#09665f"/>
    <text x="550" y="296" text-anchor="middle" font-size="22" font-weight="700">L2 Neighbourhood / shared host</text>
    <text x="550" y="323" text-anchor="middle" font-size="18">Cross-place synthesis, caching &amp; skill sharing</text>
    <rect x="35" y="255" width="245" height="106" rx="10" fill="#fff2db" stroke="#d9b478"/>
    <text x="157" y="283" text-anchor="middle" font-size="18" font-weight="700">Shared "Second Brain"</text>
    <text x="157" y="307" text-anchor="middle" font-size="16">Knowledge &amp; skill routing</text>
    <text x="157" y="329" text-anchor="middle" font-size="15">Compute &amp; solar load-balance</text>
    <text x="157" y="349" text-anchor="middle" font-size="14" fill="#52676c">Adaptive local caching</text>
    <path d="M286 305 H309" stroke="#09665f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#hierarchy-data)"/>
    <path d="M550 354 V374" fill="none" stroke="#09665f" stroke-width="2.5" stroke-dasharray="7 5" marker-start="url(#hierarchy-data)"/>
    <path d="M550 374 H220 V430 M550 374 V430 M550 374 H880 V430" fill="none" stroke="#09665f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#hierarchy-data)"/>
    <text x="35" y="412" font-size="19" font-weight="700">L1 - PLACE NODES ("SPIRIT OF THE PLACE")</text>
    <rect x="100" y="440" width="240" height="82" rx="10" fill="#fff" stroke="#09665f"/>
    <rect x="430" y="440" width="240" height="82" rx="10" fill="#fff" stroke="#09665f"/>
    <rect x="760" y="440" width="240" height="82" rx="10" fill="#fff" stroke="#09665f"/>
    <text x="220" y="470" text-anchor="middle" font-size="21" font-weight="700">School garden</text>
    <text x="550" y="470" text-anchor="middle" font-size="21" font-weight="700">Library / community</text>
    <text x="880" y="470" text-anchor="middle" font-size="21" font-weight="700">Floating research site</text>
    <text x="220" y="500" text-anchor="middle" font-size="18">Model + local memory</text>
    <text x="550" y="500" text-anchor="middle" font-size="18">Model + local memory</text>
    <text x="880" y="500" text-anchor="middle" font-size="18">Model + local memory</text>
    <path d="M350 482 H419 M680 482 H749" stroke="#09665f" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#hierarchy-data)" marker-end="url(#hierarchy-data)"/>
    <path d="M250 531 V552 M580 531 V552 M910 531 V552" stroke="#765180" stroke-width="2" marker-start="url(#hierarchy-human)" marker-end="url(#hierarchy-human)"/>
    <text x="220" y="579" text-anchor="middle" font-size="18" fill="#765180">Teachers / learners</text>
    <text x="550" y="579" text-anchor="middle" font-size="18" fill="#765180">Residents / staff</text>
    <text x="880" y="579" text-anchor="middle" font-size="18" fill="#765180">Research / teaching</text>
    <rect x="100" y="640" width="240" height="65" rx="9" fill="#e4ebed"/>
    <rect x="430" y="640" width="240" height="65" rx="9" fill="#e4ebed"/>
    <rect x="760" y="640" width="240" height="65" rx="9" fill="#e4ebed"/>
    <text x="220" y="668" text-anchor="middle" font-size="18" font-weight="700">L0 - Microclimate</text>
    <text x="550" y="668" text-anchor="middle" font-size="18" font-weight="700">L0 - Local observations</text>
    <text x="880" y="668" text-anchor="middle" font-size="18" font-weight="700">L0 - Water / energy</text>
    <text x="220" y="692" text-anchor="middle" font-size="16">Readings or defined events</text>
    <text x="550" y="692" text-anchor="middle" font-size="16">Readings or defined events</text>
    <text x="880" y="692" text-anchor="middle" font-size="16">Readings or defined events</text>
    <path d="M112 633 V529 M442 633 V529 M772 633 V529" stroke="#52676c" stroke-width="2" marker-end="url(#hierarchy-sensor)"/>
    <rect x="35" y="730" width="1030" height="46" rx="8" fill="#fff"/>
    <text x="55" y="759" font-size="17">Dashed: proposed inter-node exchange</text>
    <text x="395" y="759" font-size="17" fill="#52676c">Grey: observations</text>
    <text x="600" y="759" font-size="17" fill="#765180">Purple: people, not a hardware tier</text>
  </g>
</svg>
