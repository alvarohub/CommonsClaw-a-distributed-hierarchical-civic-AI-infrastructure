<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SSAI</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --dim: #888;
        --accent: #57e07a;
        --error: #ff5d5d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'DejaVu Sans', sans-serif;
        font-size: 17px;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #statusbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        font-size: 12px;
        color: var(--dim);
        border-bottom: 1px solid #222;
        flex-wrap: wrap;
      }
      #statusbar .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
      }
      #statusbar .dot.ok {
        background: var(--accent);
      }
      #statusbar .dot.err {
        background: var(--error);
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .me {
        color: var(--fg);
        font-weight: 600;
      }
      .model {
        color: #ccc;
      }
      .meta {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }
      .busy {
        color: #ffd27b;
        font-style: italic;
      }
      .error {
        color: var(--error);
      }
      #inputbar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #222;
        background: var(--bg);
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      #mic,
      #send,
      #tts {
        border: 1px solid #444;
        background: #111;
        color: var(--fg);
        border-radius: 8px;
        font-size: 20px;
        padding: 8px 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #mic.recording {
        background: var(--error);
        border-color: var(--error);
      }
      #tts.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      #q {
        flex: 1;
        min-width: 0;
        background: #111;
        color: var(--fg);
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 12px;
      }
      #q:focus {
        outline: none;
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="statusbar">
      <span class="dot" id="dot"></span>
      <span id="model">…</span>
      <span id="hw"></span>
    </div>
    <div id="transcript"></div>
    <div id="inputbar">
      <button id="mic" title="Dictate">🎤</button>
      <input id="q" type="text" placeholder="Ask something…" autocomplete="off" autofocus />
      <button id="send" title="Send">➤</button>
      <button id="tts" title="Speak answers">🔊</button>
    </div>
    <script>
      'use strict';

      const transcript = document.getElementById('transcript');
      const qInput = document.getElementById('q');
      const micBtn = document.getElementById('mic');
      const sendBtn = document.getElementById('send');
      const ttsBtn = document.getElementById('tts');
      const dot = document.getElementById('dot');
      const modelLabel = document.getElementById('model');
      const hwLabel = document.getElementById('hw');

      let busy = false;
      let ttsOn = false;
      let es = null;
      let currentModelDiv = null;

      function addLine(text, cls) {
        const div = document.createElement('div');
        div.className = cls || '';
        div.textContent = text;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
        return div;
      }

      function addUser(text) {
        addLine('ME: ' + text, 'me');
      }

      function startModel() {
        currentModelDiv = addLine('MODEL: ', 'model');
        return currentModelDiv;
      }

      function appendChunk(text) {
        if (!currentModelDiv) currentModelDiv = startModel();
        currentModelDiv.textContent += text;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function finishModel(metrics) {
        if (metrics && metrics.tokens_per_second) {
          const meta = addLine(
            `[${metrics.output_tokens ?? '?'} tok | ${metrics.tokens_per_second.toFixed(2)} tok/s | ${metrics.total_response_seconds?.toFixed(1)}s]`,
            'meta',
          );
          void meta;
        }
        if (ttsOn && currentModelDiv) {
          speak(currentModelDiv.textContent.replace(/^MODEL:\s*/, ''));
        }
        currentModelDiv = null;
        busy = false;
        sendBtn.disabled = false;
      }

      function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }

      async function refreshStatus() {
        try {
          const r = await fetch('/api/status');
          const s = await r.json();
          modelLabel.textContent = s.model + (s.available ? ' ready' : ' OFFLINE');
          dot.className = 'dot ' + (s.available ? 'ok' : 'err');
          hwLabel.textContent = `CPU ${s.cpu_percent?.toFixed(0) ?? '?'}% · RAM ${s.ram_percent?.toFixed(0) ?? '?'}% · ${s.temperature_c?.toFixed(0) ?? '?'}°C`;
        } catch {
          modelLabel.textContent = 'unreachable';
          dot.className = 'dot err';
        }
      }

      function connectStream() {
        if (es) es.close();
        es = new EventSource('/api/stream');
        es.onerror = () => {
          es.close();
          setTimeout(connectStream, 2000); // reconnect
        };

        es.addEventListener('chunk', (e) => appendChunk(e.data));
        es.addEventListener('done', (e) => {
          const data = JSON.parse(e.data);
          finishModel(data.metrics);
        });
        es.addEventListener('error', (e) => {
          if (e.data) {
            addLine('ERROR: ' + e.data, 'error');
            busy = false;
            sendBtn.disabled = false;
            currentModelDiv = null;
          }
        });
        es.addEventListener('busy', (e) => addLine('⏳ ' + e.data, 'busy'));
      }

      async function send() {
        const question = qInput.value.trim();
        if (!question || busy) return;
        busy = true;
        sendBtn.disabled = true;
        addUser(question);
        qInput.value = '';
        startModel();
        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
        } catch (err) {
          addLine('ERROR: ' + err.message, 'error');
          busy = false;
          sendBtn.disabled = false;
        }
      }

      // --- Web Speech API (STT on the phone) ---
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        recActive = false;

      if (SR) {
        rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';
        rec.onresult = (e) => {
          let interim = '',
            final = '';
          for (let i = 0; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          qInput.value = final || interim;
        };
        rec.onend = () => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (qInput.value.trim()) send();
        };
        rec.onerror = (e) => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (e.error !== 'no-speech') addLine('Mic error: ' + e.error, 'error');
        };
      } else {
        micBtn.disabled = true;
        micBtn.title = 'Speech recognition not supported in this browser';
      }

      micBtn.addEventListener('click', () => {
        if (!rec) return;
        if (recActive) {
          rec.stop();
        } else {
          recActive = true;
          micBtn.classList.add('recording');
          qInput.value = '';
          rec.start();
        }
      });

      ttsBtn.addEventListener('click', () => {
        ttsOn = !ttsOn;
        ttsBtn.classList.toggle('on', ttsOn);
        if (!ttsOn && window.speechSynthesis) window.speechSynthesis.cancel();
      });

      sendBtn.addEventListener('click', send);
      qInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      connectStream();
      refreshStatus();
      setInterval(refreshStatus, 15000);
    </script>
  </body>
</html>
