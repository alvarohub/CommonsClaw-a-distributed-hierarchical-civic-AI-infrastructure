<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SSAI</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --dim: #888;
        --accent: #57e07a;
        --error: #ff5d5d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'DejaVu Sans', sans-serif;
        font-size: 17px;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #statusbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        font-size: 12px;
        color: var(--dim);
        border-bottom: 1px solid #222;
        flex-wrap: wrap;
      }
      #statusbar .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
      }
      #statusbar .dot.ok {
        background: var(--accent);
      }
      #statusbar .dot.err {
        background: var(--error);
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .me {
        color: var(--fg);
        font-weight: 600;
      }
      .model {
        color: #ccc;
      }
      .meta {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }
      .busy {
        color: #ffd27b;
        font-style: italic;
      }
      .error {
        color: var(--error);
      }
      #inputbar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #222;
        background: var(--bg);
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      #mic,
      #send,
      #tts {
        border: 1px solid #444;
        background: #111;
        color: var(--fg);
        border-radius: 8px;
        font-size: 20px;
        padding: 8px 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #mic.recording {
        background: var(--error);
        border-color: var(--error);
      }
      .thinking {
        color: var(--dim);
        font-style: italic;
      }
      .thinking::after {
        content: '...';
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      #dot.busy {
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      #tts.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      #q {
        flex: 1;
        min-width: 0;
        background: #111;
        color: var(--fg);
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 12px;
      }
      #q:focus {
        outline: none;
        border-color: var(--accent);
      }
      #modelsel {
        background: #111;
        color: var(--dim);
        border: 1px solid #333;
        border-radius: 6px;
        font-size: 12px;
        max-width: 150px;
      }
    </style>
  </head>
  <body>
    <div id="statusbar">
      <span class="dot" id="dot"></span>
      <select id="modelsel" title="Model"></select>
      <span id="hw"></span>
    </div>
    <div id="transcript"></div>
    <div id="inputbar">
      <button id="mic" title="Dictate">🎤</button>
      <input id="q" type="text" placeholder="Ask something…" autocomplete="off" autofocus />
      <button id="send" title="Send">➤</button>
      <button id="note" title="Leave a note for the community">📝</button>
      <button id="tts" title="Speak answers">🔊</button>
    </div>
    <script>
      'use strict';

      const transcript = document.getElementById('transcript');
      const qInput = document.getElementById('q');
      const micBtn = document.getElementById('mic');
      const sendBtn = document.getElementById('send');
      const noteBtn = document.getElementById('note');
      const ttsBtn = document.getElementById('tts');
      const dot = document.getElementById('dot');
      const modelSel = document.getElementById('modelsel');
      const hwLabel = document.getElementById('hw');

      let busy = false;
      let ttsOn = true; // speaker on by default
      let currentModelDiv = null;
      let gotFirstChunk = false;
      let thinkingDiv = null;

      function resetBusy() {
        busy = false;
        sendBtn.disabled = false;
        currentModelDiv = null;
        hideThinking();
        dot.classList.remove('busy');
      }

      function showThinking() {
        hideThinking();
        thinkingDiv = addLine('MODEL is thinking', 'thinking');
        dot.classList.add('busy');
      }

      function hideThinking() {
        if (thinkingDiv) {
          thinkingDiv.remove();
          thinkingDiv = null;
        }
      }

      function addLine(text, cls) {
        const div = document.createElement('div');
        div.className = cls || '';
        div.textContent = text;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
        return div;
      }

      function addUser(text) {
        addLine('ME: ' + text, 'me');
      }

      function startModel() {
        currentModelDiv = addLine('MODEL: ', 'model');
        return currentModelDiv;
      }

      function appendChunk(text) {
        hideThinking(); // first chunk replaces the thinking indicator
        if (!currentModelDiv) currentModelDiv = startModel();
        currentModelDiv.textContent += text;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function finishModel(metrics) {
        if (metrics && metrics.tokens_per_second) {
          addLine(
            `[${metrics.output_tokens ?? '?'} tok | ${metrics.tokens_per_second.toFixed(2)} tok/s | ${metrics.total_response_seconds?.toFixed(1)}s]`,
            'meta',
          );
        }
        if (ttsOn && currentModelDiv) {
          speak(currentModelDiv.textContent.replace(/^MODEL:\s*/, ''));
        }
        resetBusy();
      }

      function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }

      async function refreshStatus() {
        try {
          const r = await fetch('/api/status');
          const s = await r.json();
          dot.className = 'dot ' + (s.available ? 'ok' : 'err') + (s.active ? ' busy' : '');
          hwLabel.textContent = `CPU ${s.cpu_percent?.toFixed(0) ?? '?'}% · RAM ${s.ram_percent?.toFixed(0) ?? '?'}% · ${s.temperature_c?.toFixed(0) ?? '?'}°C`;
        } catch {
          dot.className = 'dot err';
        }
      }

      async function loadModels() {
        try {
          const r = await fetch('/api/models');
          const d = await r.json();
          modelSel.innerHTML = '';
          for (const name of d.models) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if (name === d.default) opt.selected = true;
            modelSel.appendChild(opt);
          }
          if (!d.models.length) {
            modelSel.innerHTML = '<option>(no models)</option>';
          }
        } catch {
          modelSel.innerHTML = '<option>?</option>';
        }
      }

      // Parse an SSE stream from a fetch Response body. Calls onEvent(name, data).
      async function readSSE(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        const dispatch = (rawEvent) => {
          let name = 'message';
          let data = '';
          for (const line of rawEvent.split('\n')) {
            if (line.startsWith('event:')) name = line.slice(6).trim();
            else if (line.startsWith('data:')) data += (data ? '\n' : '') + line.slice(5).replace(/^ /, '');
            else if (line.startsWith(':')) return; // comment / heartbeat
          }
          if (data !== '' || name === 'start' || name === 'done' || name === 'error' || name === 'busy') {
            onEvent(name, data);
          }
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            dispatch(buf.slice(0, idx));
            buf = buf.slice(idx + 2);
          }
        }
        // Flush any trailing event that arrived without its blank-line
        // terminator (some servers close right after the final event).
        buf += decoder.decode();
        if (buf.trim() !== '') dispatch(buf);
      }

      async function send() {
        const question = qInput.value.trim();
        if (!question || busy) return;
        busy = true;
        sendBtn.disabled = true;
        addUser(question);
        qInput.value = '';
        showThinking();
        gotFirstChunk = false;

        // Watchdog: only fires if NOTHING arrived after sending — a truly
        // dead connection. Mid-answer pauses (Ollama stalls on the Pi can
        // exceed 30 s) are legal and must not trigger a false timeout.
        const watchdog = setInterval(() => {
          if (busy && !gotFirstChunk && Date.now() - sentAt > 60000) {
            clearInterval(watchdog);
            addLine('⚠ no response (connection failed)', 'error');
            resetBusy();
          }
        }, 5000);
        const sentAt = Date.now();

        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, model: modelSel.value }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);

          await readSSE(r, (name, data) => {
            if (name === 'chunk') {
              gotFirstChunk = true;
              appendChunk(data);
            } else if (name === 'done') finishModel(JSON.parse(data).metrics);
            else if (name === 'busy') {
              addLine('⏳ ' + data, 'busy');
              resetBusy();
            } else if (name === 'error') {
              addLine('ERROR: ' + data, 'error');
              resetBusy();
            }
          });
          // If the stream ended without a done/error, re-enable input.
          if (busy) resetBusy();
        } catch (err) {
          addLine('ERROR: ' + err.message, 'error');
          resetBusy();
        } finally {
          clearInterval(watchdog);
        }
      }

      // --- Web Speech API (STT on the phone) ---
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        recActive = false;

      if (SR) {
        rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';
        rec.onresult = (e) => {
          let interim = '',
            final = '';
          for (let i = 0; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          qInput.value = final || interim;
        };
        rec.onend = () => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (qInput.value.trim()) send();
        };
        rec.onerror = (e) => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (e.error !== 'no-speech') addLine('Mic error: ' + e.error, 'error');
        };
      } else {
        micBtn.disabled = true;
        micBtn.title = 'Speech recognition not supported in this browser';
      }

      micBtn.addEventListener('click', () => {
        if (!rec) return;
        if (recActive) {
          rec.stop();
        } else {
          recActive = true;
          micBtn.classList.add('recording');
          qInput.value = '';
          rec.start();
        }
      });

      ttsBtn.addEventListener('click', () => {
        ttsOn = !ttsOn;
        ttsBtn.classList.toggle('on', ttsOn);
        if (!ttsOn && window.speechSynthesis) window.speechSynthesis.cancel();
      });

      sendBtn.addEventListener('click', send);
      qInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      // Leave a community note instead of asking a question.
      noteBtn.addEventListener('click', async () => {
        const text = qInput.value.trim();
        if (!text) {
          addLine('📝 Type a note first, then tap 📝 to leave it.', 'meta');
          return;
        }
        try {
          const r = await fetch('/api/note', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note: text }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          addLine('📝 NOTE: ' + text, 'meta');
          qInput.value = '';
        } catch (err) {
          addLine('ERROR saving note: ' + err.message, 'error');
        }
      });

      // Speaker default-on: reflect it in the button state.
      ttsBtn.classList.add('on');

      loadModels();
      refreshStatus();
      setInterval(refreshStatus, 15000);
    </script>
  </body>
</html>
