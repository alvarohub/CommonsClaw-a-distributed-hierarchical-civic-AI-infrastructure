<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SSAI</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --dim: #888;
        --accent: #57e07a;
        --error: #ff5d5d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'DejaVu Sans', sans-serif;
        font-size: 17px;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #topbar {
        border-bottom: 1px solid #222;
        flex-shrink: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--dim);
        flex-wrap: wrap;
      }
      .row + .row {
        border-top: 1px solid #161616;
      }
      .rlabel {
        width: 52px;
        flex-shrink: 0;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #666;
      }
      .hint {
        font-size: 10px;
        color: #666;
      }
      .heard {
        font-size: 10px;
        color: #8ab4ff;
        font-style: italic;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 45vw;
      }
      .heard.wake {
        color: var(--accent);
        font-style: normal;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex-shrink: 0;
      }
      .dot.ok {
        background: var(--accent);
      }
      .dot.err {
        background: var(--error);
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .me {
        color: var(--fg);
        font-weight: 600;
      }
      .model {
        color: var(--accent); /* the kami speaks in turtle green */
      }
      .meta {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }
      .busy {
        color: #ffd27b;
        font-style: italic;
      }
      .error {
        color: var(--error);
      }
      #inputbar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #222;
        background: var(--bg);
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      #mic,
      #send,
      #tts {
        border: 1px solid #444;
        background: #111;
        color: var(--fg);
        border-radius: 8px;
        font-size: 20px;
        padding: 8px 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #mic.recording {
        background: var(--error);
        border-color: var(--error);
      }
      .thinking {
        color: var(--dim);
        font-style: italic;
      }
      .thinking::after {
        content: '...';
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      #dot.busy {
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      #tts.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      #q {
        flex: 1;
        min-width: 0;
        background: #111;
        color: var(--fg);
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 12px;
      }
      #q:focus {
        outline: none;
        border-color: var(--accent);
      }
      #modelsel {
        background: #111;
        color: var(--dim);
        border: 1px solid #333;
        border-radius: 6px;
        font-size: 12px;
        max-width: 150px;
      }
      #dashlink {
        margin-left: auto;
        text-decoration: none;
        font-size: 13px;
        color: var(--dim);
        border: 1px solid #333;
        border-radius: 6px;
        padding: 3px 8px;
      }
      #memtoggles {
        margin-left: auto;
      }
      .memt,
      .box {
        background: #111;
        border: 1px solid #333;
        border-radius: 6px;
        color: var(--dim);
        font-size: 12px;
        font-family: inherit;
        padding: 4px 9px;
        cursor: pointer;
        opacity: 0.45;
      }
      .memt.on,
      .box.on {
        opacity: 1;
        color: var(--fg);
        border-color: var(--accent);
      }
      .box:active {
        background: #1c1c1c;
      }
      #vlisten.on {
        background: var(--error);
        border-color: var(--error);
        color: var(--fg);
      }
      #title {
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--accent);
        font-weight: bold;
      }
      #title .lvl {
        color: #666;
        font-weight: normal;
        letter-spacing: 1px;
      }
      #save {
        font-size: 20px;
        padding: 8px 16px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <div class="row">
        <span id="title">CommonsClaw <span class="lvl">· turtle kami · level 1</span></span>
        <a href="/dashboard" id="dashlink" title="Dashboard">Dashboard</a>
      </div>
      <div class="row">
        <span class="rlabel">vitals</span>
        <span class="dot" id="dot"></span>
        <select id="modelsel" title="Model"></select>
        <span id="hw"></span>
      </div>
      <div class="row">
        <span class="rlabel">memory</span>
        <button class="memt on" data-cat="identity" title="Who the kami is">🧠 identity</button>
        <button class="memt" data-cat="sensors" title="What the kami senses">📡 sensors</button>
        <button class="memt" data-cat="community" title="Notes people left">📝 notes</button>
        <span class="hint">more memory, slower answers</span>
      </div>
      <div class="row">
        <span class="rlabel">voice</span>
        <button class="box" id="vmic" title="Turn the Pi's microphone on or off">🎙 mic</button>
        <button class="box" id="vwake" title="Always listening for the wake word — tap again to change the word">
          wake word
        </button>
        <button class="box" id="vpress" title="Only listens when you press Listen">press</button>
        <button class="box" id="vlisten" title="Listen to one question now">🎤 listen</button>
        <span class="hint" id="vstate">offline</span>
        <span class="heard" id="vheard"></span>
      </div>
    </header>
    <div id="transcript"></div>
    <div id="inputbar">
      <button id="mic" title="Dictate" class="hidden">🎤</button>
      <input id="q" type="text" placeholder="Ask something…" autocomplete="off" autofocus />
      <button id="send" title="Ask the kami">➤</button>
      <button id="save" title="Save my last message to the kami's memory">💾</button>
      <button id="tts" title="Speak answers" class="hidden">🔊</button>
    </div>
    <script>
      'use strict';

      const transcript = document.getElementById('transcript');
      const qInput = document.getElementById('q');
      const micBtn = document.getElementById('mic');
      const sendBtn = document.getElementById('send');
      const saveBtn = document.getElementById('save');
      const ttsBtn = document.getElementById('tts');
      const dot = document.getElementById('dot');
      const modelSel = document.getElementById('modelsel');
      const hwLabel = document.getElementById('hw');

      let busy = false;
      let ttsOn = true; // speaker on by default
      let currentModelDiv = null;
      let gotFirstChunk = false;
      let thinkingDiv = null;
      let lastUserMsg = null; // remembered so 💾 can commit it to memory
      let lastTurnTs = null; // dedupe turns coming from other frontends

      function resetBusy() {
        busy = false;
        sendBtn.disabled = false;
        currentModelDiv = null;
        hideThinking();
        dot.classList.remove('busy');
      }

      function showThinking() {
        hideThinking();
        thinkingDiv = addLine('MODEL is thinking', 'thinking');
        dot.classList.add('busy');
      }

      function hideThinking() {
        if (thinkingDiv) {
          thinkingDiv.remove();
          thinkingDiv = null;
        }
      }

      function addLine(text, cls) {
        const div = document.createElement('div');
        div.className = cls || '';
        div.textContent = text;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
        return div;
      }

      function addUser(text) {
        addLine('🙂 ' + text, 'me');
      }

      function startModel() {
        currentModelDiv = addLine('🐢 ', 'model');
        return currentModelDiv;
      }

      function appendChunk(text) {
        hideThinking(); // first chunk replaces the thinking indicator
        if (!currentModelDiv) currentModelDiv = startModel();
        currentModelDiv.textContent += text;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function finishModel(metrics) {
        if (metrics && metrics.tokens_per_second) {
          addLine(
            `[${metrics.output_tokens ?? '?'} tok | ${metrics.tokens_per_second.toFixed(2)} tok/s | ${metrics.total_response_seconds?.toFixed(1)}s]`,
            'meta',
          );
        }
        if (ttsOn && currentModelDiv) {
          speak(currentModelDiv.textContent.replace(/^🐢\s*/, ''));
        }
        resetBusy();
      }

      function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }

      async function refreshStatus() {
        try {
          const r = await fetch('/api/status');
          const s = await r.json();
          dot.className = 'dot ' + (s.available ? 'ok' : 'err') + (s.active ? ' busy' : '');
          hwLabel.textContent = `CPU ${s.cpu_percent?.toFixed(0) ?? '?'}% · RAM ${s.ram_percent?.toFixed(0) ?? '?'}% · ${s.temperature_c?.toFixed(0) ?? '?'}°C`;

          // The toggles are NODE settings, not page settings: another phone
          // (or the voice loop) may have changed them. Mirror, don't fight.
          if (s.settings && !busy && Date.now() > settingsHeldUntil) {
            const on = new Set(s.settings.memory || []);
            document.querySelectorAll('.memt').forEach((b) => {
              b.classList.toggle('on', on.has(b.dataset.cat));
            });
          }
          if (s.settings?.voice && Date.now() > voiceHeldUntil) {
            voiceCfg = s.settings.voice;
            renderVoice();
          }
          if (s.voice) {
            vState.textContent =
              (VOICE_LABEL[s.voice.state] || s.voice.state) + (s.voice.detail ? ' · ' + s.voice.detail : '');
            // What whisper actually transcribed — the only way to tell a deaf
            // microphone from a wake word that simply didn't match.
            vHeard.textContent = s.voice.heard ? '“' + s.voice.heard + '”' : '';
            vHeard.classList.toggle('wake', s.voice.state === 'awake');
          }

          // Turns that happened at the microphone (or the SSH console) are
          // published to the append-only turn log; show them here. Our own
          // web turns are skipped — they already streamed into the page.
          if (s.last_turn && s.last_turn.ts !== lastTurnTs && !busy) {
            lastTurnTs = s.last_turn.ts;
            if (s.last_turn.source !== 'web' && s.last_turn.q) {
              addLine('🎤🙂 ' + s.last_turn.q, 'me');
              if (s.last_turn.a) {
                addLine('🐢 ' + s.last_turn.a, 'model');
                if (ttsOn) speak(s.last_turn.a);
              }
            }
          }
        } catch {
          dot.className = 'dot err';
        }
      }

      async function loadModels() {
        try {
          const r = await fetch('/api/models');
          const d = await r.json();
          modelSel.innerHTML = '';
          for (const name of d.models) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if (name === d.default) opt.selected = true;
            modelSel.appendChild(opt);
          }
          if (!d.models.length) {
            modelSel.innerHTML = '<option>(no models)</option>';
          }
        } catch {
          modelSel.innerHTML = '<option>?</option>';
        }
      }

      // Parse an SSE stream from a fetch Response body. Calls onEvent(name, data).
      async function readSSE(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        const dispatch = (rawEvent) => {
          let name = 'message';
          let data = '';
          for (const line of rawEvent.split('\n')) {
            if (line.startsWith('event:')) name = line.slice(6).trim();
            else if (line.startsWith('data:')) data += (data ? '\n' : '') + line.slice(5).replace(/^ /, '');
            else if (line.startsWith(':')) return; // comment / heartbeat
          }
          if (data !== '' || name === 'start' || name === 'done' || name === 'error' || name === 'busy') {
            onEvent(name, data);
          }
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            dispatch(buf.slice(0, idx));
            buf = buf.slice(idx + 2);
          }
        }
        // Flush any trailing event that arrived without its blank-line
        // terminator (some servers close right after the final event).
        buf += decoder.decode();
        if (buf.trim() !== '') dispatch(buf);
      }

      async function send() {
        const question = qInput.value.trim();
        if (!question || busy) return;
        busy = true;
        sendBtn.disabled = true;
        addUser(question);
        lastUserMsg = question;
        qInput.value = '';
        showThinking();
        gotFirstChunk = false;

        // Watchdog: only fires if NOTHING arrived after sending — a truly
        // dead connection. Mid-answer pauses (Ollama stalls on the Pi can
        // exceed 30 s) are legal and must not trigger a false timeout.
        const watchdog = setInterval(() => {
          if (busy && !gotFirstChunk && Date.now() - sentAt > 60000) {
            clearInterval(watchdog);
            addLine('⚠ no response (connection failed)', 'error');
            resetBusy();
          }
        }, 5000);
        const sentAt = Date.now();

        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question,
              model: modelSel.value,
              memory: activeMemoryCategories(),
            }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);

          await readSSE(r, (name, data) => {
            if (name === 'chunk') {
              gotFirstChunk = true;
              appendChunk(data);
            } else if (name === 'done') finishModel(JSON.parse(data).metrics);
            else if (name === 'busy') {
              addLine('⏳ ' + data, 'busy');
              resetBusy();
            } else if (name === 'error') {
              addLine('ERROR: ' + data, 'error');
              resetBusy();
            }
          });
          // If the stream ended without a done/error, re-enable input.
          if (busy) resetBusy();
        } catch (err) {
          addLine('ERROR: ' + err.message, 'error');
          resetBusy();
        } finally {
          clearInterval(watchdog);
        }
      }

      // --- Web Speech API (STT on the phone) ---
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        recActive = false;

      if (SR) {
        rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';
        rec.onresult = (e) => {
          let interim = '',
            final = '';
          for (let i = 0; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          qInput.value = final || interim;
        };
        rec.onend = () => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (qInput.value.trim()) send();
        };
        rec.onerror = (e) => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (e.error !== 'no-speech') addLine('Mic error: ' + e.error, 'error');
        };
      } else {
        micBtn.disabled = true;
        micBtn.title = 'Speech recognition not supported in this browser';
      }

      micBtn.addEventListener('click', () => {
        if (!rec) return;
        if (recActive) {
          rec.stop();
        } else {
          recActive = true;
          micBtn.classList.add('recording');
          qInput.value = '';
          rec.start();
        }
      });

      ttsBtn.addEventListener('click', () => {
        ttsOn = !ttsOn;
        ttsBtn.classList.toggle('on', ttsOn);
        if (!ttsOn && window.speechSynthesis) window.speechSynthesis.cancel();
      });

      sendBtn.addEventListener('click', send);
      qInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      // 💾 — save the last thing I said into the kami's community memory.
      saveBtn.addEventListener('click', async () => {
        const text = qInput.value.trim() || lastUserMsg;
        if (!text) {
          addLine('💾 Say something first, then tap 💾 to have it remembered.', 'meta');
          return;
        }
        try {
          const r = await fetch('/api/note', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note: text }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          addLine('💾 remembered: "' + text + '"', 'meta');
          qInput.value = '';
          // The kami acknowledges — it will see the note next question.
          addLine('KAMI: I will remember that.', 'model');
        } catch (err) {
          addLine('ERROR saving note: ' + err.message, 'error');
        }
      });

      // Memory category toggles (🧠 identity / 📡 sensors / 📝 community).
      // These are NODE-wide: saved on the Pi, so the microphone and the
      // console read exactly the same memory as this page.
      let settingsHeldUntil = 0; // ignore polled state right after a change

      function activeMemoryCategories() {
        return [...document.querySelectorAll('.memt.on')].map((b) => b.dataset.cat);
      }
      async function saveSettings() {
        settingsHeldUntil = Date.now() + 3000;
        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              memory: activeMemoryCategories(),
              model: modelSel.value || null,
            }),
          });
        } catch {}
      }
      document.querySelectorAll('.memt').forEach((b) =>
        b.addEventListener('click', () => {
          b.classList.toggle('on');
          saveSettings();
        }),
      );
      modelSel.addEventListener('change', saveSettings);

      // --- the Pi's microphone, driven from here ---------------------------
      // Nothing is started or stopped here: the voice process polls these
      // settings and reports back what it is doing — or doesn't, if it isn't
      // running at all, and then the state honestly reads "offline".
      const vMic = document.getElementById('vmic');
      const vWake = document.getElementById('vwake');
      const vPress = document.getElementById('vpress');
      const vListen = document.getElementById('vlisten');
      const vState = document.getElementById('vstate');
      const vHeard = document.getElementById('vheard');

      const VOICE_LABEL = {
        offline: 'voice process not running on the Pi',
        off: 'microphone off',
        ready: 'ready — press listen',
        waking: 'listening for the wake word',
        awake: '🐢 yes? — ask now',
        listening: '● recording…',
        transcribing: 'transcribing…',
        thinking: 'asking the kami…',
      };

      let voiceCfg = { enabled: false, mode: 'wake', wake_word: 'turtle' };
      let voiceHeldUntil = 0;

      function renderVoice() {
        vMic.classList.toggle('on', voiceCfg.enabled);
        vMic.textContent = voiceCfg.enabled ? '🎙 mic on' : '🎙 mic off';
        vWake.textContent = 'wake “' + voiceCfg.wake_word + '”';
        vWake.classList.toggle('on', voiceCfg.enabled && voiceCfg.mode === 'wake');
        vPress.classList.toggle('on', voiceCfg.enabled && voiceCfg.mode === 'button');
      }
      async function postVoice(patch) {
        voiceHeldUntil = Date.now() + 3000;
        voiceCfg = { ...voiceCfg, ...patch };
        renderVoice();
        try {
          await fetch('/api/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patch),
          });
        } catch {}
      }
      vMic.addEventListener('click', () => postVoice({ enabled: !voiceCfg.enabled }));
      vWake.addEventListener('click', () => {
        if (voiceCfg.enabled && voiceCfg.mode === 'wake') {
          const w = prompt('Wake word — say this to get the kami’s attention:', voiceCfg.wake_word);
          if (w && w.trim()) postVoice({ enabled: true, mode: 'wake', wake_word: w.trim() });
          return;
        }
        postVoice({ enabled: true, mode: 'wake' });
      });
      vPress.addEventListener('click', () => postVoice({ enabled: true, mode: 'button' }));
      vListen.addEventListener('click', async () => {
        vListen.classList.add('on');
        setTimeout(() => vListen.classList.remove('on'), 1200);
        try {
          await fetch('/api/listen', { method: 'POST' });
        } catch {}
      });
      renderVoice();

      // Speaker default-on: reflect it in the button state.
      ttsBtn.classList.add('on');

      loadModels();
      refreshStatus();
      // Faster while the microphone is live, so "heard" feels immediate.
      (function poll() {
        setTimeout(
          async () => {
            await refreshStatus();
            poll();
          },
          voiceCfg.enabled ? 1500 : 5000,
        );
      })();
    </script>
  </body>
</html>
